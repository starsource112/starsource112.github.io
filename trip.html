<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>巡演地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .bg-poster {
            position: absolute;
            right: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: url("./Back.jpg") no-repeat center center;
            z-index: 1;
            background-size: contain;
        }

        .map-container {
            width: 90%;
            max-width: 1450px;
            position: relative;
            z-index: 2;
            margin-left: -480px;
            margin-bottom: -160px;
            margin-right: auto;
        }

        .city {
            fill: #000000;
            stroke: #409eff;
            stroke-width: 1;
            transition: all 0.3s ease;
            cursor: pointer;
            transform: scale(1.2);
            transform-origin: center center;
        }

        /* 2023基础城市：X轴右移5px，Y轴不动（统一间距基准） */
        .city:not(.city-2024) {
            transform: scale(1.2) translate(5px, 0);
        }

        .city:hover {
            fill: #409eff;
            filter: drop-shadow(0 0 13px #409eff);
        }

        .city-2024 {
            stroke: #ff9500;
            stroke-width: 1.2;
            transform: scale(1.2);
            transform-origin: center center;
        }

        /* 所有重复城市：X轴左移5px（和武汉间距完全一致），Y轴0，无额外偏移 */
        .city-2024.city-duplicate {
            transform: scale(1.2) translate(8px, 0);
        }

        .city-2024:hover {
            fill: #ff9500;
            filter: drop-shadow(0 0 13px #ff9500);
        }

        .city-duplicate {
            fill: #000000;
            stroke: #ff9500;
            stroke-width: 1.2;
        }

        .city-duplicate:hover {
            fill: #ff9500;
            filter: drop-shadow(0 0 13px #ff9500);
        }

        .tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgb(0, 0, 0);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            border: 1px solid;
            white-space: nowrap;
            line-height: 1.6;
        }

        .vertical-title {
            position: absolute;
            right: 115px;
            top: 48%;
            transform: translateY(-50%);
            font-size: 120px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 3;
            white-space: nowrap;
            /* 1. 字体蓝橙渐变（替换原有橙色color） */
            background-image: linear-gradient(to top, #066eff, #ff9500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.1;
        }
    </style>
</head>

    <script>
        const tooltip = document.getElementById('tooltip');
        const cities = document.querySelectorAll('.city');

        cities.forEach(city => {
            city.addEventListener('mouseover', (e) => {
                const cityName = e.target.getAttribute('data-city');
                const date = e.target.getAttribute('data-date');
                tooltip.innerHTML = `
                    <div><strong>${cityName}</strong></div>
                    <div>${date}</div>
                `;

                let targetColor = '#409eff';
                if (city.classList.contains('city-2024')) {
                    targetColor = '#ff9500';
                }
                tooltip.style.borderColor = targetColor;
                tooltip.style.color = targetColor;

                const cityRect = city.getBoundingClientRect();
                const containerRect = document.querySelector('.map-container').getBoundingClientRect();
                const relativeLeft = cityRect.right - containerRect.left + 15;
                const relativeTop = cityRect.top - containerRect.top + (cityRect.height - tooltip.offsetHeight) / 2;

                tooltip.style.left = `${relativeLeft}px`;
                tooltip.style.top = `${relativeTop}px`;
                tooltip.style.opacity = 1;
            });

            city.addEventListener('mouseout', () => {
                tooltip.style.opacity = 0;
            });

            city.addEventListener('mousemove', (e) => {
                const cityRect = city.getBoundingClientRect();
                const containerRect = document.querySelector('.map-container').getBoundingClientRect();
                const relativeLeft = cityRect.right - containerRect.left + 15;
                const relativeTop = cityRect.top - containerRect.top + (cityRect.height - tooltip.offsetHeight) / 2;

                tooltip.style.left = `${relativeLeft}px`;
                tooltip.style.top = `${relativeTop}px`;
            });
        });
    </script>
